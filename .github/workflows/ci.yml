name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une seule exécution par branche : un nouveau push annule la précédente,
# qui porte de toute façon sur du code périmé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualite:
    name: Lint, types, format et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - run: npm ci
      # Le worker a ses propres dépendances (pg) : Railway n'installe que
      # celles-là, et Vercel ne les voit pas.
      - run: npm ci --prefix worker

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

      # Le build n'appelle pas Supabase : les variables NEXT_PUBLIC_ sont
      # simplement inscrites dans le bundle. Des valeurs factices suffisent
      # donc, et évitent d'exposer les vraies dans les journaux de CI.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  securite:
    name: Cloisonnement et droits d'administration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - run: npm ci
      # Le worker a ses propres dépendances (pg) : Railway n'installe que
      # celles-là, et Vercel ne les voit pas.
      - run: npm ci --prefix worker

      # L'outil Supabase est celui que `npm ci` vient d'installer, à la
      # version verrouillée dans package-lock.json : la même qu'en local.
      # Demander la dernière version interrogeait l'API GitHub, dont le quota
      # dépassé a fait échouer le job avant tout test le 2 octobre 2026.

      # Démarre Postgres, Auth et Storage, puis applique les migrations.
      # Les tests créent de vrais comptes et de vraies lignes : la RLS ne se
      # simule pas, elle s'éprouve.
      - name: Démarrer Supabase
        run: npx supabase start

      - name: Vérifier que les migrations s'appliquent proprement
        run: npx supabase db reset

      - name: Tests
        run: npm test

      # Tests SQL (pgTAP) : ce qui ne s'observe pas par l'API, comme les
      # droits d'exécution des fonctions, se vérifie dans le catalogue.
      - name: Tests de la base
        run: npx supabase test db

      # Les types sont générés depuis le schéma : s'ils divergent, le typage
      # ment sur l'état réel de la base.
      #
      # On régénère par-dessus le fichier commité, puis on applique Prettier
      # avant de comparer. La CLI produit du code non formaté, alors que le
      # dépôt le stocke formaté : sans cette étape, la comparaison échouerait
      # sur la seule mise en forme.
      - name: Vérifier que les types sont à jour
        run: |
          npm run db:types
          npx prettier --write src/lib/supabase/database.types.ts
          if ! git diff --quiet src/lib/supabase/database.types.ts; then
            echo "::error::Les types ne correspondent plus au schema. Lancez 'npm run db:types', formatez, puis commitez le resultat."
            git --no-pager diff src/lib/supabase/database.types.ts
            exit 1
          fi

      - name: Arrêter Supabase
        if: always()
        run: npx supabase stop
